name: Check npm auth

# Temporary: proves the npm_token secret authenticates before the first
# irreversible publish. Delete once verified.
on: workflow_dispatch

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
